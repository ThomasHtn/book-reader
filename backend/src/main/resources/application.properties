# =============================================================================
# Application
# =============================================================================
# Name shown in logs and actuator info.
spring.application.name=book-reader
# Admin auth is handled by AdminApiKeyFilter; without this Boot logs a generated password nobody uses.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# =============================================================================
# Database
# =============================================================================
# PostgreSQL 17 connection; the defaults match the development database of compose.yaml (`make db`).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/book_reader}
spring.datasource.username=${DB_USERNAME:book_reader}
spring.datasource.password=${DB_PASSWORD:book_reader}
# Small pool: a single reader on a shared VPS never needs Hikari's default of ten connections.
spring.datasource.hikari.maximum-pool-size=5
# A database outage fails a request after 3 s instead of Hikari's 30 s, so the screen says so quickly.
spring.datasource.hikari.connection-timeout=3000
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
# No database session while rendering JSON: services return DTOs.
spring.jpa.open-in-view=false
# Instants are written and read in UTC whatever the server time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Migrations under src/main/resources/db/migration run at startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# =============================================================================
# JSON
# =============================================================================
# Instants are serialized in UTC.
spring.jackson.time-zone=UTC
# =============================================================================
# HTTP server
# =============================================================================
# Lets in-flight requests, such as a catalogue import, finish on shutdown.
server.shutdown=graceful
# Compresses JSON, mostly book contents; error payloads use the problem+json type.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
# Upload limit: the EPUB size limit below, itself aligned with nginx and Traefik (specification section 11).
spring.servlet.multipart.max-file-size=${app.catalogue.max-epub-size}
spring.servlet.multipart.max-request-size=${app.catalogue.max-epub-size}
# Client address from the proxy's X-Forwarded-For, trusted only from private networks (Tomcat RemoteIpValve).
# Not `framework`: it also honours a client-sent `Forwarded` header, which would defeat the admin lockout.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}
# =============================================================================
# Actuator
# =============================================================================
# Own port, never routed by the proxy: a routing mistake cannot publish metrics or build details.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Liveness and readiness also on the main port as /livez and /readyz, for the public probe and the healthcheck.
management.endpoint.health.probes.add-additional-paths=true
# Ready means the database answers: an uptime probe on readiness then reports a database outage.
management.endpoint.health.group.readiness.include=readinessState,db
# Tells this application's series apart from the other VPS apps scraped by the same Prometheus.
management.metrics.tags.application=${spring.application.name}
# =============================================================================
# OpenAPI (off unless API_DOCS_ENABLED: the document maps the whole admin surface)
# =============================================================================
# Both follow app.api-docs-enabled, which SecurityConfig reads too.
springdoc.api-docs.enabled=${app.api-docs-enabled}
springdoc.swagger-ui.enabled=${app.api-docs-enabled}
# Paths of the OpenAPI document and Swagger UI, opened by SecurityConfig when enabled.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Documents this application's API only, not actuator or framework endpoints.
springdoc.packages-to-scan=io.github.thomashtn.bookreader
springdoc.paths-to-match=/api/**
# =============================================================================
# Application settings
# =============================================================================
# Administrator key, at least 32 characters; no default, so the application refuses to start without it.
app.admin-api-key=${ADMIN_API_KEY}
# Serves the OpenAPI document and Swagger UI.
app.api-docs-enabled=${API_DOCS_ENABLED:false}
# Wrong keys allowed per address, and how long the address is then locked out.
app.admin-rate-limit.max-failures=${ADMIN_RATE_LIMIT_MAX_FAILURES:5}
app.admin-rate-limit.lockout-duration=${ADMIN_RATE_LIMIT_LOCKOUT_DURATION:PT1M}
# =============================================================================
# OPDS catalogue (Ebooks libres et gratuits)
# =============================================================================
# Site root; tests point it at a fake server.
app.catalogue.base-url=${CATALOGUE_BASE_URL:https://www.ebooksgratuits.com/}
# Longest wait for the TCP connection.
app.catalogue.connect-timeout=${CATALOGUE_CONNECT_TIMEOUT:PT5S}
# Longest silence between two reads, not the whole download.
app.catalogue.read-timeout=${CATALOGUE_READ_TIMEOUT:PT15S}
# Longest time for a whole call, retry included: stops a site that sends its answer drop by drop.
app.catalogue.request-timeout=${CATALOGUE_REQUEST_TIMEOUT:PT60S}
# Largest EPUB accepted, downloaded or uploaded; the multipart limits above reuse it.
app.catalogue.max-epub-size=20MB
