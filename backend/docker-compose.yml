# Local development database.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: book_reader
      POSTGRES_USER: ${DB_USERNAME:-book_reader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-book_reader}
    ports:
      - "5432:5432"
    volumes:
      - book-reader-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-book_reader} -d book_reader"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  book-reader-postgres-data:
