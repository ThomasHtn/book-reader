name: End-to-end

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journey:
    name: Reader journey (Playwright, axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Fresh empty database: the journey starts without any book.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: book_reader
          POSTGRES_USER: book_reader
          POSTGRES_PASSWORD: book_reader
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U book_reader -d book_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Quality gates already run in backend-ci.yml; the journey only needs the jar.
      - name: Package backend
        working-directory: backend
        run: chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the journey
        working-directory: frontend
        run: npm run e2e

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
