name: Deliver

# Every push to main: both test suites, then both images started from compose.yaml, scanned and
# driven by the browser tests, and only then pushed to GHCR, tagged with the commit.
# A tag v<x.y.z> does the same, adds the version tags and publishes a GitHub release.
# A pull request touching the images or compose.yaml runs it all without pushing anything.
# The server only pulls what this pushed, so a commit whose checks failed has no image and cannot be deployed.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main
    paths:
      - '**/Dockerfile'
      - '**/.dockerignore'
      - 'frontend/nginx.conf.template'
      - 'frontend/ngsw-config.json'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'compose.yaml'
      - '.github/workflows/deliver.yml'

  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running delivery: only the latest commit of main gets deployed.
concurrency:
  group: deliver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend-ci.yml

  images:
    name: Images
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write

    # One job for both images: the smoke test and the browser tests need them side by side.
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing pushes back: no token left on disk for later steps.
        with:
          persist-credentials: false

      # Registry paths must be lowercase; the owner name is not.
      - name: Compute registry
        run: echo "IMAGE_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # A release tag must name the version both halves carry (`make version`), or the images would lie.
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          backend=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('backend/pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          frontend=$(node -p "require('./frontend/package.json').version")
          echo "Tag ${GITHUB_REF_NAME#v}, backend $backend, frontend $frontend"
          [[ "${GITHUB_REF_NAME#v}" == "$backend" && "$backend" == "$frontend" ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha-<full commit> is what a server deploys; main follows the latest delivery of main; a release
      # tag adds x.y.z and x.y. The OCI labels carry the commit and the repository.
      - name: Compute backend tags and labels
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/book-reader-backend
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Compute frontend tags and labels
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REGISTRY }}/book-reader-frontend
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # =============================================================================
      # Build for this runner and load into Docker, to be tested before anything is pushed
      # =============================================================================
      # The layer cache lives in GitHub Actions, so an image whose side did not change rebuilds in seconds.
      # The extra tag is the name compose.yaml gives the image, so the smoke test starts this very build.
      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.meta-backend.outputs.tags }}
            book-reader-backend
          cache-from: type=gha,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.meta-frontend.outputs.tags }}
            book-reader-frontend
          cache-from: type=gha,scope=frontend

      # =============================================================================
      # Smoke test: the whole app from its images, through its single entry point
      # =============================================================================
      # Demo settings of backend/.env.example (administrator key book-reader-demo-admin-key-0123456789),
      # on http://localhost:8000, with an empty library: the browser tests start from it.
      - name: Start the app
        run: docker compose up --no-build --detach --wait --wait-timeout 180

      - name: Probe the public routes
        run: |
          curl --fail --silent --show-error http://localhost:8000/readyz
          curl --fail --silent --show-error http://localhost:8000/healthz
          curl --fail --silent --show-error http://localhost:8000/api/settings
          curl --fail --silent --show-error http://localhost:8000/api/books
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/

      # =============================================================================
      # Vulnerability scan: a fixable high or critical advisory blocks the delivery
      # =============================================================================
      # Unfixed advisories are only reported: nothing could be bumped to clear them.
      - name: Scan backend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REGISTRY }}/book-reader-backend:sha-${{ github.sha }}
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Scan frontend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE_REGISTRY }}/book-reader-frontend:sha-${{ github.sha }}
          severity-cutoff: high
          only-fixed: true
          output-format: table

      # =============================================================================
      # Browser tests against the running app
      # =============================================================================
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The reader journey of specification section 12, with axe-core on every screen.
      - name: Run browser tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      # =============================================================================
      # Push: the very layers tested above, from the builder cache (amd64 only, like the servers)
      # =============================================================================
      # SBOM and full provenance are attached to each image, so a user can tell what it holds and
      # which workflow built it from which commit.
      - name: Push backend
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    # Notes generated from the merged pull requests and commits since the previous tag.
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
