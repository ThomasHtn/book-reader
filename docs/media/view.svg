<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="The reading screen: Mes livres, title and author, two facing pages, page numbers, and one bar under each page">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #f6f0e3 }
    .ink { fill: #2b251d }
    .ink3 { fill: #776d5f }
    .paper { fill: #efe6d3 }
    .frame { stroke: #2b251d; stroke-opacity: .25; stroke-width: 2; fill: none }
    .glyph { stroke: #2b251d; stroke-opacity: .55; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round }
    .line { fill: #2b251d; fill-opacity: .55 }
    .muted { fill: #2b251d; fill-opacity: .3 }
    .bar { fill: #d6cdbb }
    .fold { stroke: #2b251d; stroke-opacity: .12; stroke-width: 2 }
    .num { fill: #7a2233 }
    .numtxt { fill: #fffaf0 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1915 }
      .ink { fill: #efe6d3 }
      .ink3 { fill: #a39a8a }
      .frame { stroke: #ffffff; stroke-opacity: .25 }
      .num { fill: #e8a3b0 }
      .numtxt { fill: #1c1915 }
    }
  </style>

  <rect class="bg" width="1400" height="600" rx="26" />
  <rect class="paper" x="80" y="70" width="680" height="460" rx="14" />
  <rect class="frame" x="80" y="70" width="680" height="460" rx="14" />
