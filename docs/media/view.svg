  <circle class="num" cx="52" cy="106" r="14" />
  <text class="numtxt" x="52" y="112" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <circle class="num" cx="650" cy="44" r="14" />
  <text class="numtxt" x="650" y="50" font-size="16" font-weight="700" text-anchor="middle">2</text>
  <circle class="num" cx="52" cy="270" r="14" />
  <text class="numtxt" x="52" y="276" font-size="16" font-weight="700" text-anchor="middle">3</text>
  <circle class="num" cx="788" cy="442" r="14" />
  <text class="numtxt" x="788" y="448" font-size="16" font-weight="700" text-anchor="middle">4</text>
  <circle class="num" cx="788" cy="484" r="14" />
  <text class="numtxt" x="788" y="490" font-size="16" font-weight="700" text-anchor="middle">5</text>
  <circle class="num" cx="844" cy="123" r="14" />
  <text class="numtxt" x="844" y="129" font-size="16" font-weight="700" text-anchor="middle">1</text>
  <text class="ink" x="874" y="130" font-size="22" font-weight="600" letter-spacing="-.3">Mes livres</text>
  <text class="ink3" x="874" y="158" font-size="17">The only way out. Nothing else to find.</text>
  <circle class="num" cx="844" cy="207" r="14" />
  <text class="numtxt" x="844" y="213" font-size="16" font-weight="700" text-anchor="middle">2</text>
  <text class="ink" x="874" y="214" font-size="22" font-weight="600" letter-spacing="-.3">Title and author</text>
  <text class="ink3" x="874" y="242" font-size="17">Small and muted: a state, never a command.</text>
  <circle class="num" cx="844" cy="291" r="14" />
  <text class="numtxt" x="844" y="297" font-size="16" font-weight="700" text-anchor="middle">3</text>
  <text class="ink" x="874" y="298" font-size="22" font-weight="600" letter-spacing="-.3">Two facing pages</text>
  <text class="ink3" x="874" y="326" font-size="17">Lines of about forty characters, regular weight.</text>
  <circle class="num" cx="844" cy="375" r="14" />
  <text class="numtxt" x="844" y="381" font-size="16" font-weight="700" text-anchor="middle">4</text>
  <text class="ink" x="874" y="382" font-size="22" font-weight="600" letter-spacing="-.3">Page numbers</text>
  <text class="ink3" x="874" y="410" font-size="17">Under each page, the total under the last one.</text>
  <circle class="num" cx="844" cy="459" r="14" />
  <text class="numtxt" x="844" y="465" font-size="16" font-weight="700" text-anchor="middle">5</text>
  <text class="ink" x="874" y="466" font-size="22" font-weight="600" letter-spacing="-.3">Précédent, Suivant</text>
  <text class="ink3" x="874" y="494" font-size="17">Each under the page it turns. Nowhere to go: no bar.</text>
</svg>
