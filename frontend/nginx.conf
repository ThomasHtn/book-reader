server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Aligned with Traefik and Spring (specification section 11).
	client_max_body_size 20m;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

	# Private reader: never indexed. Headers are repeated in each location because add_header does not inherit.
	add_header X-Robots-Tag "noindex, nofollow" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# Hashed bundles and fonts never change under a given URL.
	location ~* \.(?:js|css|woff2)$ {
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# The service worker decides which version runs: it must always be revalidated.
	location ~ ^/(?:ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Cache-Control "no-cache" always;
	}

	# SPA shell: names the hashed bundles, so never cached; unknown paths fall back to it.
	location / {
		add_header X-Robots-Tag "noindex, nofollow" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache" always;
		try_files $uri /index.html;
	}
}
