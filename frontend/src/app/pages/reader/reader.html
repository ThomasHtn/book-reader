<!-- Book unreachable: the status screen stands in until a retry succeeds (spec 5.6). -->
@if (unreachable()) {
  <app-status-screen (retry)="retry()" />
} @else {
  <!-- Laid out but hidden until the first page is placed; no context menu on the reader (spec 5.1). -->
  <div
    class="screen"
    [style.visibility]="location() ? null : 'hidden'"
    (contextmenu)="$event.preventDefault()"
  >
    <!-- Page indicator alone at the top right, announced politely on each turn (spec 5.1). -->
    <header class="page-head">
      <p class="page-indicator" aria-live="polite">{{ indicator() }}</p>
    </header>
    <main>
      <!-- Title for screen readers; the title page shows it on screen. -->
      <h1 class="visually-hidden">{{ title() }}</h1>
      <!-- Reading surface: focusable by script only, to take the focus back after a click (spec 5.1). -->
      <section class="paged reading" lang="fr" aria-label="Texte du livre" tabindex="-1" #text>
        <!-- One page window; DomChapterLayout fills and translates the columns inside it (spec 5.2). -->
        <div class="paged-viewport" #viewport>
          <div class="paged-columns" #columns></div>
        </div>
      </section>
    </main>
    <!-- The three commands; a bar with nowhere to go is removed and the other takes its room (spec 5.1). -->
    <footer class="nav-footer">
      <div class="nav-row nav-row--exit">
        <button type="button" class="nav-bar nav-bar--exit" (click)="openLibrary()">
          <span>Mes livres</span>
        </button>
        <!-- No "Précédent" on the first page of the book. -->
        @if (!isFirst()) {
          <app-nav-bar direction="previous" (activate)="onBar('previous')" />
        }
        <!-- No "Suivant" on the last page of the book. -->
        @if (!isLast()) {
          <app-nav-bar direction="next" (activate)="onBar('next')" />
        }
      </div>
    </footer>
  </div>
}
