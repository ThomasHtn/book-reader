<!-- List never loaded: the status screen stands in until the server answers (spec 5.6). -->
@if (data.unreachable()) {
  <app-status-screen (retry)="data.retry()" />
} @else {
  <div class="grid h-full grid-cols-[minmax(0,1fr)] grid-rows-[auto_minmax(0,1fr)_auto]">
    <!-- Head line: title, "Titres 1 à 6 sur 7" announced on each turn, and the caregiver's gear. -->
    <app-page-head heading="Mes livres" [indicator]="indicator()" wide>
      <!-- Discreet entry to /admin for the caregiver; its name comes from aria-label (spec 14). -->
      <button
        type="button"
        class="library__settings fixed inline-flex items-center justify-center"
        aria-label="Réglages"
        (click)="openAdmin()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94L14.4 2.81a.49.49 0 0 0-.48-.41h-3.84a.49.49 0 0 0-.48.41L9.25 5.35c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.59.22L2.74 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.05.3-.09.62-.09.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"
          />
        </svg>
      </button>
    </app-page-head>
    <main class="grid min-h-0 grid-rows-[minmax(0,1fr)]">
      <!-- Empty shelf once the list arrived; before that, nothing at all (spec 5.4). -->
      @if (data.books()?.length === 0) {
        <p class="library__empty place-self-center p-(--reading-padding) text-center">
          Aucun livre pour l'instant. Ils apparaîtront ici dès leur ajout.
        </p>
      } @else {
        <!-- One page of rows; the grid inside is translated by whole rows, never scrolled. -->
        <div
          class="library__viewport mx-auto h-full w-full max-w-(--grid-max-width) overflow-hidden px-(--grid-padding)"
          #viewport
        >
          <div
            class="library__grid grid auto-rows-fr grid-cols-[repeat(var(--grid-columns),1fr)] content-start gap-(--grid-gap) pt-(--reading-padding)"
            #grid
            [style.transform]="transform()"
          >
            <!-- Cards off the shown page stay laid out but inert, so Tab and screen readers skip them; a card not
                 measured yet stays visible. -->
            @for (entry of entries(); track entry.book.id; let index = $index) {
              <app-book-card
                [title]="entry.book.title"
                [author]="entry.book.author"
                [current]="entry.current"
                [finished]="entry.finished"
                [tone]="tones()[index]"
                [attr.inert]="(cardPages()[index] ?? page()) === page() ? null : ''"
                (activate)="open(entry.book.id)"
              />
            }
          </div>
        </div>
      }
    </main>
    <!-- Footer only when the titles span more than one page (spec 5.1). -->
    @if (pages() > 1) {
      <footer>
        <div class="flex gap-(--nav-row-gap) p-(--nav-row-padding)">
          @if (page() > 0) {
            <app-nav-bar
              direction="previous"
              context="titres précédents"
              (activate)="onBar('previous')"
            />
          }
          @if (page() < pages() - 1) {
            <app-nav-bar direction="next" context="titres suivants" (activate)="onBar('next')" />
          }
        </div>
      </footer>
    }
  </div>
}
