@if (session.key()) {
  <div class="admin">
    <header class="a-header">
      <span class="brand" aria-hidden="true">L</span>
      <h1>Administration</h1>
      <button
        type="button"
        class="a-btn a-btn--secondary a-btn--sm ml-auto"
        (click)="session.signOut()"
      >
        Se déconnecter
      </button>
    </header>
    <main class="a-main">
      <router-outlet />
    </main>
    <nav class="a-nav" aria-label="Sections du backoffice">
      <a routerLink="/admin/catalogue" routerLinkActive ariaCurrentWhenActive="page">
        <svg aria-hidden="true" lucideSearch></svg>
        Catalogue
      </a>
      <a routerLink="/admin/bibliotheque" routerLinkActive ariaCurrentWhenActive="page">
        <svg aria-hidden="true" lucideLibrary></svg>
        Bibliothèque
      </a>
      <a routerLink="/admin/depot" routerLinkActive ariaCurrentWhenActive="page">
        <svg aria-hidden="true" lucideUpload></svg>
        Dépôt
      </a>
      <a routerLink="/admin/reglages" routerLinkActive ariaCurrentWhenActive="page">
        <svg aria-hidden="true" lucideSettings></svg>
        Réglages
      </a>
    </nav>
  </div>
} @else {
  <main class="admin a-login">
    <form class="a-card" (submit)="signIn($event)">
      <h1>Liseuse, administration</h1>
      <div class="a-field">
        <label for="admin-key">Clé d'administration</label>
        <input
          id="admin-key"
          class="a-input"
          type="password"
          autocomplete="current-password"
          [value]="keyInput()"
          (input)="keyInput.set($any($event.target).value)"
        />
      </div>
      <button
        type="submit"
        class="a-btn a-btn--primary"
        [disabled]="checking()"
        [attr.aria-busy]="checking() || null"
      >
        Entrer
      </button>
      @if (error(); as message) {
        <p role="alert" class="a-message a-message--failure">{{ message }}</p>
      }
    </form>
  </main>
}
