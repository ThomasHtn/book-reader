<!-- A stored key means the server accepted it: show the backoffice, else the sign-in screen. -->
@if (session.key()) {
  <div class="admin">
    <!-- Header: brand, one link per section, sign-out. -->
    <header class="a-header">
      <div class="a-brand">
        <span class="a-brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <h1>Liseuse <small>administration</small></h1>
      </div>
      <!-- ariaCurrentWhenActive tells screen readers which section is open. -->
      <nav class="a-nav" aria-label="Sections du backoffice">
        <a routerLink="/admin/catalogue" routerLinkActive ariaCurrentWhenActive="page">
          <svg aria-hidden="true" lucideSearch></svg>
          Catalogue
        </a>
        <a routerLink="/admin/bibliotheque" routerLinkActive ariaCurrentWhenActive="page">
          <svg aria-hidden="true" lucideLibrary></svg>
          Bibliothèque
        </a>
        <a routerLink="/admin/depot" routerLinkActive ariaCurrentWhenActive="page">
          <svg aria-hidden="true" lucideUpload></svg>
          Dépôt
        </a>
        <a routerLink="/admin/reglages" routerLinkActive ariaCurrentWhenActive="page">
          <svg aria-hidden="true" lucideSettings></svg>
          Réglages
        </a>
      </nav>
      <button type="button" class="a-signout" (click)="session.signOut()">
        <svg aria-hidden="true" lucideLogOut></svg>
        Se déconnecter
      </button>
    </header>
    <!-- The section chosen in the nav renders here. -->
    <main class="a-main">
      <router-outlet />
    </main>
  </div>
} @else {
  <main class="admin a-login">
    <!-- Way out for someone who landed here by mistake. -->
    <a routerLink="/livres" class="a-login-back">
      <svg aria-hidden="true" lucideArrowLeft></svg>
      Retour aux livres
    </a>
    <!-- Sign-in form: the key is a password field so the browser can remember it. -->
    <form class="a-card a-login__card" (submit)="signIn($event)">
      <span class="a-brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Liseuse, administration</h1>
      <div class="a-field">
        <label for="admin-key">Clé d'administration</label>
        <input
          id="admin-key"
          class="a-input"
          type="password"
          autocomplete="current-password"
          [value]="keyInput()"
          (input)="keyInput.set($any($event.target).value)"
        />
      </div>
      <!-- Busy while the server checks the key, so it cannot be sent twice. -->
      <button
        type="submit"
        class="a-btn a-btn--primary"
        [disabled]="checking()"
        [attr.aria-busy]="checking() || null"
      >
        @if (checking()) {
          <svg aria-hidden="true" lucideLoaderCircle class="a-spin"></svg>
        } @else {
          <svg aria-hidden="true" lucideLogIn></svg>
        }
        Entrer
      </button>
      <!-- role=alert announces the refusal as soon as it appears. -->
      @if (error(); as message) {
        <p role="alert" class="a-message a-message--failure">{{ message }}</p>
      }
    </form>
  </main>
}
