@if (session.key()) {
  <div class="admin">
    <header class="a-header">
      <span class="brand" aria-hidden="true">L</span>
      <h1>Liseuse, administration</h1>
      <button
        type="button"
        class="a-btn a-btn--secondary a-btn--sm ml-auto"
        (click)="session.signOut()"
      >
        Se déconnecter
      </button>
    </header>
    <main class="a-main">
      <router-outlet />
    </main>
    <nav class="a-nav" aria-label="Sections du backoffice">
      <a routerLink="/admin/catalogue" routerLinkActive ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        Catalogue
      </a>
      <a routerLink="/admin/bibliotheque" routerLinkActive ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4 1-3 14-4-1z" />
        </svg>
        Bibliothèque
      </a>
      <a routerLink="/admin/depot" routerLinkActive ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v4h16v-4" />
        </svg>
        Dépôt
      </a>
      <a routerLink="/admin/reglages" routerLinkActive ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 2.5a7 7 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7 7 0 0 0 1.7 1l.4 2.5h5l.4-2.5a7 7 0 0 0 1.7-1l2.3 1 2-3.5-2-1.5c.1-.3.1-.7.1-1z"
          />
        </svg>
        Réglages
      </a>
    </nav>
  </div>
} @else {
  <main class="admin a-login">
    <form class="a-card" (submit)="signIn($event)">
      <h1>Liseuse, administration</h1>
      <div class="a-field">
        <label for="admin-key">Clé d'administration</label>
        <input
          id="admin-key"
          class="a-input"
          type="password"
          autocomplete="current-password"
          [value]="keyInput()"
          (input)="keyInput.set($any($event.target).value)"
        />
      </div>
      <button
        type="submit"
        class="a-btn a-btn--primary"
        [disabled]="checking()"
        [attr.aria-busy]="checking() || null"
      >
        Entrer
      </button>
      @if (error(); as message) {
        <p role="alert" class="a-message a-message--failure">{{ message }}</p>
      }
    </form>
  </main>
}
