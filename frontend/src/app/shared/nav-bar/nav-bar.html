<!-- aria-label starts with the visible label, then says what turns: "Suivant, page suivante". -->
<button
  type="button"
  class="nav-bar flex min-w-0 items-center justify-center gap-(--space-2)"
  [class.nav-bar--prev]="direction() === 'previous'"
  [class.nav-bar--next]="direction() === 'next'"
  [class.nav-bar--exit]="direction() === 'exit'"
  [attr.aria-label]="accessibleName()"
  (click)="activate.emit()"
>
  <!-- Back arrow before "Mes livres": a shaft and a head, unlike the page-turn chevrons. -->
  @if (direction() === 'exit') {
    <svg class="nav-bar__arrow nav-bar__arrow--back" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M85 50 H18 M45 22 L17 50 L45 78" />
    </svg>
  }
  <!-- Decorative arrow on the outer side: before the label for Précédent, after it for Suivant. -->
  @if (direction() === 'previous') {
    <svg class="nav-bar__arrow" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M70 10 L30 50 L70 90" />
    </svg>
  }
  <span class="nav-bar__label">{{ label() }}</span>
  @if (direction() === 'next') {
    <svg class="nav-bar__arrow" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M30 10 L70 50 L30 90" />
    </svg>
  }
</button>
